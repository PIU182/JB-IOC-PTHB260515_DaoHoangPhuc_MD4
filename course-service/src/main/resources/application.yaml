spring:
  application:
    name: course-service
  datasource:
    url: jdbc:postgresql://localhost:5432/course_db
    username: postgres
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka



